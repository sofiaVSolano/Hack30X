[project]
name = "hack30x-backend"
version = "0.1.0"
description = "Backend de HACK 30X (FastAPI). Hoy solo integra el módulo DETECTAR."
requires-python = ">=3.12"
# Versiones fijas = las instaladas y verificadas en backend/.venv (Python 3.13.14), 17/10/2026.
dependencies = [
    "fastapi==0.139.0",
    "uvicorn==0.49.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.14.2",
    "httpx==0.28.1",
    "sqlalchemy==2.0.51",
    "defusedxml==0.7.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "respx==0.23.1",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# Sin reglas adicionales: mismas reglas por defecto de Ruff con las que se validaron E1 a E11.
# Versión objetivo coherente con requires-python (verificado: no genera hallazgos nuevos).
target-version = "py312"
